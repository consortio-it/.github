name: Bug report
description: Something is behaving incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What is happening
      description: Describe the incorrect behaviour and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Steps, or the smallest case that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Where
      description: Environment, version, or deployment this was seen in.
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocking work
        - Degraded but workable
        - Cosmetic
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Logs or screenshots
      description: Paste anything useful. Redact credentials and customer data first.
    validations:
      required: false
